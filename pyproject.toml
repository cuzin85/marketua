[project]
name = "marketua"
version = "0.1.0"
description = "MCP server that lets AI agents search Ukrainian marketplaces (OLX, Hotline, Prom; Rozetka via Bright Data)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
marketua = "marketua.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marketua", "marketua.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
