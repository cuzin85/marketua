# Smithery configuration: https://smithery.ai/docs/config#smitheryyaml
name: marketua
version: 0.1.0
description: >-
  Search Ukrainian marketplaces (OLX, Hotline, Prom; Rozetka via Bright Data)
  from a plain-language prompt — structured offers with prices and links.
author: cuzin85
repository: https://github.com/cuzin85/marketua
license: MIT
category: ecommerce
tags:
  - ukraine
  - marketplace
  - olx
  - hotline
  - prom
  - rozetka
  - price-comparison
capabilities:
  - marketplace-search
  - price-comparison
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      disableProviders:
        type: string
        description: >-
          Optional: comma-separated marketplaces to disable (olx, hotline, prom)
  commandFunction: |-
    (config) => {
      const env = {};
      if (config.disableProviders) env.MARKETUA_DISABLE_PROVIDERS = config.disableProviders;
      return { command: 'uvx', args: ['marketua'], env };
    }
